name: RetroHub CI

on:
  pull_request:
    branches: [main, feat/neon-cloud-storage]
  push:
    branches: [main, feat/neon-cloud-storage, feat/retrohub-ai-center]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --include=dev
      - name: Type-check
        run: npm run lint
      - name: Build
        run: npm run build
